apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
# Prometheus가 node-exporter가 수집한 노드(서버)의 시스템 정보를 15초마다 데이터를 주기적으로 받아 저장하고 처리 => prometheus.yml로 저장 
#  <노드 IP>:10250 : Prometheus가 k8s 노드를 자동 탐색할 때 사용하는 기본 주소(__address__라벨이 붙어있음). 이것을 :9100 으로 대체
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):10250'
            replacement: '${1}:9100'
            target_label: __address__

      # soldesk의 수집 annotation이 있는 백엔드 Pod를 자동으로 찾아 수집합니다.
      # HPA가 늘린 새 Pod도 자동 발견하며 Gateway를 거치지 않고 직접 접근합니다.
      - job_name: 'spring-apps'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['soldesk']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: 'Running'
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: '8080'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: '(.+)'
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '${1}:${2}'
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
