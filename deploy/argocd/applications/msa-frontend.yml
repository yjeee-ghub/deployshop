apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: msa-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yjeee-ghub/deployshop.git
    targetRevision: main
    path: deploy/k8s/apps/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: soldesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
